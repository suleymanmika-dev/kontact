<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Экстренная связь</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; background: #111; color: #fff; margin: 0; padding: 20px; }
        h1 { font-size: 24px; margin-bottom: 5px; color: #ff3b30; }
        .status { color: #aaa; font-size: 14px; margin-bottom: 20px; }
        .videos { display: flex; flex-direction: column; gap: 15px; align-items: center; justify-content: center; }
        @media(min-width: 600px) { .videos { flex-direction: row; } }
        video { width: 90%; max-width: 400px; background: #222; border-radius: 12px; border: 2px solid #333; }
        #remote-video { border-color: #ff3b30; } /* Видео собеседника выделим красным */
        .btn { background: #007aff; color: white; border: none; padding: 15px 30px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 90%; max-width: 400px; margin-top: 15px; }
        .btn-copy { background: #34c759; }
    </style>
    <script src="https://unpkg.com"></script>
</head>
<body>

    <h1>🚨 Экстренный созвон</h1>
    <div id="status" class="status">Подключение к сети...</div>

    <div class="videos">
        <video id="local-video" autoplay muted playsinline></video>
        <video id="remote-video" autoplay playsinline></video>
    </div>

    <button id="action-btn" class="btn btn-copy" style="display:none;">Скопировать ссылку для СМС</button>

    <script src="app.js"></script>
</body>
</html>
